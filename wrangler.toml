# Cloudflare Workers 配置，线上已由deploy.yml接管，这里仅供本地测试
name = "cf-server-monitor"
main = "src/index.js"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]
account_id = "be820e2585bc7b28ff29db4ae9d42adf"
workers_dev = false

keep_vars = true

# 定时任务配置（UTC）
# - 每分钟：执行离线节点、资源告警
# - 每小时：合并执行其他定时任务（表轮换、旧表清理、按配置时区/小时触发服务器到期检测）
# - 注意同步修改deploy和index.js scheduled函数里面的值
[triggers]
crons = ["*/1 * * * *", "0 * * * *"]

[assets]
directory = "./dist"
binding = "ASSETS"

[[routes]]
pattern = "vpsyyds.eu.org"
custom_domain = true
zone_name = "vpsyyds.eu.org"

[[d1_databases]]
binding = "DB"
database_name = "server-monitor-db"
database_id = "c75ce179-34af-4f32-a83b-e8a1f984ca6a"

# Durable Objects：实时指标广播中心
# 注意：首次部署前需要执行 `wrangler durable-object create MetricsBroadcaster --class MetricsBroadcaster`
# 或者在部署后，wrangler 会自动创建对应的 DO namespace。
[[durable_objects.bindings]]
name = "METRICS_BROADCASTER"
class_name = "MetricsBroadcaster"

[[migrations]]
tag = "v1"

# 开发服务器配置
[dev]
port = 8787
local_protocol = "https"
